<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- lid -->
  <rect x="36" y="8" width="56" height="15" rx="6" fill="#f59e0b"/>
  <rect x="42" y="23" width="44" height="9" rx="3.5" fill="#d97706"/>

  <!-- jar body -->
  <path d="M42 30 H86 V36 C96 39 102 46 102 56 V100 C102 110 94 118 84 118 H44 C34 118 26 110 26 100 V56 C26 46 32 39 42 36 Z"
        fill="url(#glass)"/>

  <!-- papers inside -->
  <g transform="rotate(-8 64 78)">
    <rect x="46" y="54" width="34" height="48" rx="3" fill="#fef3c7"/>
  </g>
  <g transform="rotate(7 68 80)">
    <rect x="51" y="56" width="34" height="48" rx="3" fill="#ffffff"/>
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round">
      <line x1="58" y1="68" x2="79" y2="68"/>
      <line x1="58" y1="77" x2="79" y2="77"/>
      <line x1="58" y1="86" x2="74" y2="86"/>
      <line x1="58" y1="95" x2="70" y2="95"/>
    </g>
  </g>

  <!-- glass shine -->
  <rect x="32" y="50" width="8" height="54" rx="4" fill="#ffffff" opacity="0.4"/>
  <rect x="92" y="52" width="5" height="20" rx="2.5" fill="#ffffff" opacity="0.3"/>
</svg>
