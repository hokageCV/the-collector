<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Collector — Saved Articles</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1em; }
      #export { padding: 8px 14px; font-size: 14px; }
      #empty { color: #777; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #e2e2e2; border-radius: 6px; margin-bottom: 8px; background: #fff; }
      li.dragging { opacity: 0.5; }
      li.drop-target { border-color: #1e7e34; }
      .handle { cursor: grab; color: #999; user-select: none; }
      .info { flex: 1; min-width: 0; }
      .title { font-weight: 600; }
      .sub { font-size: 12px; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub a { color: #555; }
      .del { border: none; background: transparent; color: #c0392b; cursor: pointer; font-size: 16px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Saved Articles</h1>
      <button id="export" disabled>Export bundle</button>
    </header>
    <p id="empty">No articles saved yet. Use the popup on a blog post to save one.</p>
    <ul id="list"></ul>
    <script type="module" src="options.js"></script>
  </body>
</html>
