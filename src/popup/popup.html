<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Collector</title>
    <link rel="stylesheet" href="../styles/theme.css" />
    <style>
      * { box-sizing: border-box; }
      html { background: transparent; }
      body {
        width: 304px;
        margin: 0;
        padding: 16px 14px 14px;
        border-radius: var(--radius-lg);
        font-family: var(--font-ui);
        background:
          radial-gradient(120% 90% at 50% -20%, rgba(255, 152, 0, 0.07), transparent 60%),
          var(--color-c-background);
        color: var(--color-c-text);
      }
      .masthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .masthead h1 {
        margin: 0;
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 650;
        font-size: 18px;
      }
      #save {
        width: 100%;
        padding: 11px 12px;
        font-family: var(--font-ui);
        font-size: 12.5px;
        font-weight: 700;
        text-transform: uppercase;
        color: #1c1815;
        background: linear-gradient(180deg, var(--color-c-accent-subtle), var(--color-c-accent));
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          0 6px 16px -8px rgba(255, 152, 0, 0.55);
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      }
      #save:hover:not(:disabled) {
        filter: brightness(1.06);
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          0 10px 20px -8px rgba(255, 152, 0, 0.6);
      }
      #save:active:not(:disabled) {
        transform: translateY(0);
        filter: brightness(0.97);
      }
      #save:disabled { opacity: 0.55; cursor: default; }
      #status {
        min-height: 18px;
        margin: 10px 2px 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--color-c-text-muted);
        overflow-wrap: anywhere;
        transition: color 0.15s ease;
      }
      #status[data-kind='error'] { color: var(--color-c-primary); }
      #status[data-kind='success'] { color: var(--color-c-secondary); }
      .library { margin-top: 12px; }
      #saved-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      #saved-header strong {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--color-c-text-muted);
      }
      #export {
        padding: 5px 12px;
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--color-c-text);
        background: var(--color-c-surface-muted);
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.12s ease, transform 0.12s ease;
      }
      #export:hover:not(:disabled) {
        background: var(--color-c-border);
        transform: translateY(-1px);
      }
      #export:disabled { opacity: 0.4; cursor: default; }
      #empty {
        margin: 18px 4px;
        text-align: center;
        font-family: var(--font-display);
        font-style: italic;
        font-size: 13.5px;
        color: var(--color-c-text-muted);
      }
      #empty span {
        display: block;
        margin-top: 5px;
        font-family: var(--font-ui);
        font-style: normal;
        font-size: 11.5px;
        opacity: 0.75;
      }
      #saved {
        list-style: none;
        margin: 8px 0 0;
        padding: 2px;
        max-height: 236px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--color-c-border) transparent;
      }
      #saved::-webkit-scrollbar { width: 8px; }
      #saved::-webkit-scrollbar-thumb {
        background: var(--color-c-surface-muted);
        border-radius: 99px;
      }
      #saved::-webkit-scrollbar-thumb:hover { background: var(--color-c-border); }
      #saved li {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        padding: 8px 10px;
        font-size: 12.5px;
        background: var(--color-c-surface);
        border-radius: 9px;
        box-shadow: var(--shadow-card);
        transition: background 0.12s ease;
        animation: rise 0.22s ease backwards;
      }
      #saved li:hover { background: var(--color-c-surface-muted); }
      #saved li:nth-child(2) { animation-delay: 0.03s; }
      #saved li:nth-child(3) { animation-delay: 0.06s; }
      #saved li:nth-child(4) { animation-delay: 0.09s; }
      #saved li:nth-child(5) { animation-delay: 0.12s; }
      #saved li:nth-child(n + 6) { animation-delay: 0.15s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(5px); }
      }
      #saved .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: default;
      }
      #saved .del {
        flex: none;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--color-c-primary);
        opacity: 0.55;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        transition: opacity 0.12s ease, background 0.12s ease;
      }
      #saved .del:hover {
        opacity: 1;
        background: rgba(229, 115, 115, 0.14);
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <h1>The Collector</h1>
    </header>
    <button id="save">Save this article</button>
    <p id="status" role="status"></p>
    <section class="library">
      <div id="saved-header">
        <strong>Collection</strong>
        <button id="export" disabled>Export</button>
      </div>
      <p id="empty">Nothing collected yet.<br /><span>Open an article and press save.</span></p>
      <ul id="saved"></ul>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
