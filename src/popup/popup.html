<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Collector</title>
    <style>
      body { width: 280px; font-family: system-ui, sans-serif; padding: 12px; }
      #save { width: 100%; padding: 8px; font-size: 14px; }
      #status { font-size: 12px; min-height: 16px; margin: 8px 0; color: #555; }
      #status[data-kind='error'] { color: #c0392b; }
      #status[data-kind='success'] { color: #1e7e34; }
      hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
      #saved-header { display: flex; align-items: center; justify-content: space-between; }
      #saved-header strong { font-size: 13px; }
      #export { padding: 4px 10px; font-size: 12px; }
      #saved { list-style: none; padding: 0; margin: 8px 0 0; max-height: 220px; overflow-y: auto; }
      #saved li { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; }
      #saved .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
      #saved .del { border: none; background: transparent; color: #c0392b; cursor: pointer; font-size: 14px; padding: 0 2px; }
      #empty { font-size: 12px; color: #999; margin-top: 6px; }
    </style>
  </head>
  <body>
    <button id="save">Save Article</button>
    <p id="status"></p>
    <hr />
    <div id="saved-header">
      <strong>Saved (<span id="count">0</span>)</strong>
      <button id="export" disabled>Export</button>
    </div>
    <p id="empty">Nothing saved yet.</p>
    <ul id="saved"></ul>
    <script type="module" src="popup.js"></script>
  </body>
</html>
